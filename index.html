<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3202a">
<title>Regalos de Reyes 👑</title>
<style>
:root{
  --red:#b3202a; --red-d:#8e1620; --gold:#e0a526; --gold-l:#fbe9b7;
  --green:#1f6b45; --green-l:#dff2e6; --cream:#fff8ec; --ink:#2b2220; --muted:#7a6a62; --line:#efe0c4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15}
a{color:var(--green);font-weight:600}

/* Pantallas centradas */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.center .big{font-size:56px}
.card-info{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;max-width:520px;text-align:left}
.card-info ol{padding-left:20px;margin:8px 0}
code{background:var(--gold-l);padding:2px 6px;border-radius:6px;font-size:.9em}

/* Inicio */
.hero{background:var(--red);background-image:radial-gradient(circle at 15% 30%,rgba(224,165,38,.35) 0 3px,transparent 4px),radial-gradient(circle at 80% 20%,rgba(224,165,38,.35) 0 2px,transparent 3px),radial-gradient(circle at 60% 75%,rgba(224,165,38,.3) 0 3px,transparent 4px);color:#fff;text-align:center;padding:36px 20px 44px;border-radius:0 0 32px 32px;box-shadow:0 6px 18px rgba(142,22,32,.25)}
.hero .crown{font-size:52px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hero h1{font-size:30px;margin:6px 0}
.hero p{margin:0;opacity:.92}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.prow{display:flex;gap:8px;margin-bottom:10px}
.person{flex:1;display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;text-align:left;min-height:64px}
.person:active{transform:scale(.98);border-color:var(--gold)}
.av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#5a3b00;font-weight:800;display:grid;place-items:center;font-size:20px;flex:none}
.nm{font-weight:700;font-size:18px;flex:1;word-break:break-word}
.lock{opacity:.7}

/* Botones */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.buy{background:var(--green);color:#fff;width:100%}
.btn.block{width:100%}
.btn.small{padding:8px 12px;min-height:40px;font-size:15px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px;cursor:pointer;display:block;margin:6px auto}
.icon{border:2px solid var(--line);background:#fff;border-radius:14px;width:52px;font-size:20px;cursor:pointer}
.icon.danger{border-color:#f1c2c2}
.spacer{height:10px}

/* App */
.topbar{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));box-shadow:0 3px 10px rgba(0,0,0,.15)}
.topbar b{font-size:18px}
.topbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
main h2{font-size:24px;margin-bottom:6px}
.hint{color:var(--muted);margin:0 0 16px;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:24px}
nav.tabs button.on{color:var(--red)}
nav.tabs button.on span{transform:scale(1.15)}

/* Tarjetas de regalo */
.gift{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.gift.done{background:var(--green-l);border-color:#bfe3cc}
.gift h3{font-size:19px;word-break:break-word}
.badge{display:inline-block;font-size:13px;font-weight:700;background:var(--gold-l);border-radius:20px;padding:3px 10px;margin:6px 6px 0 0}
.meta{margin-top:8px;font-size:15px;color:var(--muted);word-break:break-word}
.meta a{display:inline-block;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.bought{font-weight:700;color:var(--green);margin:12px 0 8px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .big{font-size:48px}

/* Familia */
.fam{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-align:left}
.fam:active{border-color:var(--gold)}
.fam .sum{font-size:14px;color:var(--muted)}
.fam .grow{flex:1}
.bar{height:8px;background:var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px}
.back{background:none;border:0;color:var(--red);font-weight:700;padding:6px 0 12px;cursor:pointer;font-size:16px}
.famwrap{margin-bottom:10px}
.famwrap .fam{margin-bottom:6px}
.nudge{background:var(--gold-l);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.total{background:var(--gold-l);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.group-title{font-weight:800;margin:18px 0 8px;color:var(--red)}

/* Modal */
#modal-root:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(30,10,10,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:22px;margin-bottom:12px}
.sheet label{display:block;font-weight:600;margin-bottom:12px;font-size:15px}
.sheet input,.sheet select,.sheet textarea{display:block;width:100%;margin-top:5px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:400;font-size:17px}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:none;border-color:var(--gold)}
.row{display:flex;gap:10px;margin-top:6px}
.row .btn{flex:1}
.pin{letter-spacing:10px;text-align:center;font-size:24px!important}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#2b2220;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<noscript>Necesitas activar JavaScript para usar esta página.</noscript>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, writeBatch, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   👇👇  PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO DE FIREBASE  👇👇
   (Firebase → Configuración del proyecto → Tus apps → Web → firebaseConfig)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDEskNH8pB2VVrLdrrA8yNEzCZz9Db2XX4",
  authDomain: "reyes-family.firebaseapp.com",
  projectId: "reyes-family",
  storageBucket: "reyes-family.firebasestorage.app",
  messagingSenderId: "312285526960",
  appId: "1:312285526960:web:28f60333d4c325b69bb475"
};
/* ============================================================
   👆👆  FIN DE LA CONFIGURACIÓN  👆👆
   ============================================================ */

const configured = firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("PEGA") && firebaseConfig.projectId;
let db = null;
if (configured) db = getFirestore(initializeApp(firebaseConfig));

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PRI = {
  1: { t: "Me hace mucha ilusión", e: "💛" },
  2: { t: "Me gustaría", e: "🙂" },
  3: { t: "Si sobra presupuesto", e: "🍀" }
};
const money = n => Number(n).toLocaleString("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 2 });
const initial = n => (String(n).trim()[0] || "?").toUpperCase();
const DAY = 24 * 60 * 60 * 1000;
function nudgeBtn(m) {
  const recent = Date.now() - (m.lastNudge || 0) < DAY;
  return recent
    ? `<button class="btn ghost small block" disabled>👋 Hoy ya le han dado un toque</button>`
    : `<button class="btn ghost small block" data-act="nudge" data-id="${esc(m.id)}">👋 Dar un toque (anónimo)</button>`;
}
function safeUrl(u) {
  u = (u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { return new URL(u).href; } catch { return ""; }
}
async function hashPin(pin) {
  const s = "reyes:" + pin;
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
    return "f" + h;
  }
}
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }

/* ---------- Estado ---------- */
const S = {
  members: [], gifts: [],
  me: load("reyes_me"),
  tab: "mine", viewing: null, manage: false,
  ready: { m: false, g: false }, error: false
};
const sortG = (a, b) => (a.priority - b.priority) || (a.created - b.created);
const giftsOf = id => S.gifts.filter(g => g.ownerId === id).sort(sortG);
const memberName = id => S.members.find(m => m.id === id)?.name || "—";

/* ---------- Datos en tiempo real ---------- */
function onErr(e) { console.error(e); S.error = true; render(); }
function start() {
  onSnapshot(collection(db, "members"), snap => {
    S.members = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name, "es"));
    S.ready.m = true; render();
  }, onErr);
  onSnapshot(collection(db, "gifts"), snap => {
    S.gifts = snap.docs.map(d => { const x = d.data(); return { id: d.id, ...x, created: x.createdAt?.toMillis?.() ?? Date.now() }; });
    S.ready.g = true; render();
  }, onErr);
}

/* ---------- Vistas ---------- */
function render() {
  const app = $("#app");
  if (!configured) { app.innerHTML = setupHTML(); return; }
  if (S.error) { app.innerHTML = errorHTML(); return; }
  if (!S.ready.m || !S.ready.g) { app.innerHTML = `<div class="center"><div class="big">⭐</div><b>Cargando los regalos…</b></div>`; return; }
  const me = S.members.find(m => m.id === S.me);
  if (!me) { app.innerHTML = homeHTML(); return; }
  app.innerHTML = shellHTML(me);
}

function setupHTML() {
  return `<div class="center"><div class="big">👑</div><h2>Casi listo</h2>
  <div class="card-info"><p>Falta conectar la app con tu base de datos de Firebase.</p>
  <ol><li>Abre este archivo con un editor de texto.</li><li>Busca el bloque <code>firebaseConfig</code>.</li><li>Pega ahí los datos de tu proyecto de Firebase.</li><li>Guarda y vuelve a abrir la página.</li></ol></div></div>`;
}
function errorHTML() {
  return `<div class="center"><div class="big">😵</div><h2>No se puede conectar</h2>
  <div class="card-info"><p>Revisa que:</p><ol><li>Los datos de <code>firebaseConfig</code> están bien copiados.</li><li>Has creado la base de datos <b>Firestore</b>.</li><li>Las <b>reglas</b> de Firestore permiten leer y escribir (mira la guía).</li></ol></div>
  <button class="btn primary" onclick="location.reload()">Reintentar</button></div>`;
}

function homeHTML() {
  const list = S.members.map(m => `
    <div class="prow">
      <button class="person" data-act="login" data-id="${esc(m.id)}">
        <span class="av">${esc(initial(m.name))}</span><span class="nm">${esc(m.name)}</span>${m.pinHash ? '<span class="lock">🔒</span>' : ""}
      </button>
      ${S.manage ? `<button class="icon danger" data-act="delMember" data-id="${esc(m.id)}" aria-label="Eliminar a ${esc(m.name)}">🗑️</button>` : ""}
    </div>`).join("");
  return `
  <header class="hero"><div class="crown">👑</div><h1>Regalos de Reyes</h1><p>${S.manage ? "Toca la papelera para quitar a alguien" : "¿Quién eres?"}</p></header>
  <div class="wrap">
    ${list || `<div class="empty"><div class="big">🎁</div><p>Todavía no hay nadie. ¡Añade a la primera persona!</p></div>`}
    <div class="spacer"></div>
    <button class="btn primary block" data-act="addMember">＋ Añadir persona</button>
    ${S.members.length ? `<button class="link" data-act="toggleManage">${S.manage ? "Listo" : "Gestionar familia"}</button>` : ""}
  </div>`;
}

function shellHTML(me) {
  let body;
  if (S.tab === "mine") body = mineHTML(me);
  else if (S.tab === "buys") body = buysHTML(me);
  else body = (S.viewing && S.viewing !== me.id && S.members.some(m => m.id === S.viewing)) ? personHTML(me) : familyHTML(me);
  const tab = (id, ico, txt) => `<button class="${S.tab === id ? "on" : ""}" data-act="tab" data-tab="${id}"><span>${ico}</span>${txt}</button>`;
  return `
  <div class="topbar"><b>👑 Hola, ${esc(me.name)}</b><button data-act="logout">Cambiar</button></div>
  <main>${body}</main>
  <nav class="tabs">${tab("mine", "🎁", "Mi lista")}${tab("family", "👨‍👩‍👧", "Familia")}${tab("buys", "🛒", "Mis compras")}</nav>`;
}

function giftInfo(g) {
  const p = PRI[g.priority] || PRI[2];
  const link = g.url ? `<div><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">🔗 Ver enlace</a></div>` : "";
  return `<h3>${esc(g.title)}</h3>
    <span class="badge">${p.e} ${p.t}</span>${g.price != null ? `<span class="badge">≈ ${money(g.price)}</span>` : ""}
    ${g.note ? `<div class="meta">📝 ${esc(g.note)}</div>` : ""}${link ? `<div class="meta">${link}</div>` : ""}`;
}

/* Mi lista: NUNCA muestra estado de compra */
function mineHTML(me) {
  const gs = giftsOf(me.id);
  return `<h2>Mi lista de Reyes</h2>
  <p class="hint">Solo tú ves esta lista tal cual. Nadie te dirá qué se ha comprado 🤫</p>
  ${gs.length === 0 && me.lastNudge ? `<div class="nudge">👋 Alguien de la familia te recuerda que aún no has apuntado ningún regalo. ¡Los Reyes esperan! 🎁</div>` : ""}
  <button class="btn primary block" data-act="addGift">＋ Añadir regalo</button><div class="spacer"></div>
  ${gs.length ? gs.map(g => `<div class="gift">${giftInfo(g)}
      <div class="actions"><button class="btn ghost small" data-act="editGift" data-id="${esc(g.id)}">✏️ Editar</button><button class="btn ghost small" data-act="delGift" data-id="${esc(g.id)}">🗑️ Borrar</button></div></div>`).join("")
    : `<div class="empty"><div class="big">✨</div><p>Tu lista está vacía. ¡Cuéntale a los Reyes qué te hace ilusión!</p></div>`}`;
}

/* Familia: resumen por persona (solo para los demás) */
function familyHTML(me) {
  const others = S.members.filter(m => m.id !== me.id);
  if (!others.length) return `<h2>Familia</h2><div class="empty"><div class="big">👨‍👩‍👧</div><p>Aún no hay más gente. Que se unan los demás desde la pantalla de inicio.</p></div>`;
  return `<h2>Familia</h2><p class="hint">Toca a una persona para ver su lista y marcar lo que ya has comprado.</p>
  ${others.map(m => {
    const n = giftsOf(m.id).length;
    return `<div class="famwrap"><button class="fam" data-act="open" data-id="${esc(m.id)}"><span class="av">${esc(initial(m.name))}</span>
      <span class="grow"><b>${esc(m.name)}</b><div class="sum">${n ? `${n} ${n === 1 ? "regalo" : "regalos"}` : "Aún sin regalos"}</div></span><span>›</span></button>${n === 0 ? nudgeBtn(m) : ""}</div>`;
  }).join("")}`;
}

function personHTML(me) {
  const o = S.members.find(m => m.id === S.viewing);
  const gs = giftsOf(o.id);
  return `<button class="back" data-act="back">‹ Volver</button>
  <h2>Lista de ${esc(o.name)}</h2><p class="hint">Marca lo que ya has comprado para que nadie lo repita. ${esc(o.name)} no verá nada de esto 🤫</p>
  ${gs.length ? gs.map(g => {
    let st;
    if (!g.boughtBy) st = `<button class="btn buy" data-act="buy" data-id="${esc(g.id)}">🛍️ Ya lo he comprado</button>`;
    else if (g.boughtBy === me.id) st = `<div class="bought">✅ Lo has comprado tú</div><button class="btn ghost small" data-act="unbuy" data-id="${esc(g.id)}">Desmarcar</button>`;
    else st = `<div class="bought">✅ Ya comprado</div><button class="btn buy" disabled>Ya comprado</button>`;
    return `<div class="gift ${g.boughtBy ? "done" : ""}">${giftInfo(g)}<div class="actions" style="display:block">${st}</div></div>`;
  }).join("") : `<div class="empty"><div class="big">🤔</div><p>${esc(o.name)} todavía no ha apuntado nada.</p></div>${nudgeBtn(o)}`}`;
}

function buysHTML(me) {
  const mine = S.gifts.filter(g => g.boughtBy === me.id && S.members.some(m => m.id === g.ownerId));
  if (!mine.length) return `<h2>Mis compras</h2><div class="empty"><div class="big">🛒</div><p>Aún no has marcado ningún regalo como comprado.</p></div>`;
  const total = mine.reduce((s, g) => s + (g.price || 0), 0);
  const groups = {};
  mine.forEach(g => (groups[g.ownerId] ||= []).push(g));
  return `<h2>Mis compras</h2><p class="hint">Los regalos que tú has marcado como comprados.</p>
  ${total > 0 ? `<div class="total">💰 Llevas gastado aprox. ${money(total)}</div>` : ""}
  ${Object.keys(groups).map(id => `<div class="group-title">Para ${esc(memberName(id))}</div>${groups[id].sort(sortG).map(g => `<div class="gift done">${giftInfo(g)}<div class="actions"><button class="btn ghost small" data-act="unbuy" data-id="${esc(g.id)}">Desmarcar</button></div></div>`).join("")}`).join("")}`;
}

/* ---------- Modales ---------- */
function openModal(html) {
  $("#modal-root").innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog">${html}</div></div>`;
  const f = $("#modal-root input:not([type=hidden])");
  if (f) setTimeout(() => f.focus(), 50);
}
function closeModal() { $("#modal-root").innerHTML = ""; }

function giftModal(id) {
  const g = id ? S.gifts.find(x => x.id === id) : null;
  openModal(`<h3>${g ? "Editar regalo" : "Nuevo regalo"} 🎁</h3>
  <form data-form="gift" data-id="${esc(id || "")}">
    <label>¿Qué te gustaría? *<input name="title" required maxlength="80" value="${esc(g?.title)}" placeholder="Ej.: Zapatillas de running"></label>
    <label>Enlace (opcional)<input name="url" type="text" inputmode="url" value="${esc(g?.url)}" placeholder="https://…"></label>
    <label>Precio aproximado en € (opcional)<input name="price" type="number" inputmode="decimal" min="0" step="0.01" value="${g?.price != null ? esc(g.price) : ""}"></label>
    <label>Nota (talla, color…)<textarea name="note" rows="2" maxlength="200">${esc(g?.note)}</textarea></label>
    <label>Prioridad<select name="priority">${[1, 2, 3].map(k => `<option value="${k}" ${(g?.priority ?? 2) === k ? "selected" : ""}>${PRI[k].e} ${PRI[k].t}</option>`).join("")}</select></label>
    <div class="row"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn primary">Guardar</button></div>
  </form>`);
}
function memberModal() {
  openModal(`<h3>Añadir persona 👑</h3>
  <form data-form="member">
    <label>Nombre *<input name="name" required maxlength="30" placeholder="Ej.: Abuela Pilar"></label>
    <label>PIN de 4 números (opcional)<input class="pin" name="pin" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="••••"></label>
    <p class="hint">Con PIN, nadie más podrá entrar como tú. Si no lo quieres, déjalo en blanco.</p>
    <div class="row"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn primary">Añadir</button></div>
  </form>`);
}
function pinModal(m) {
  openModal(`<h3>Hola, ${esc(m.name)} 🔒</h3>
  <form data-form="pin" data-id="${esc(m.id)}">
    <label>Tu PIN<input class="pin" name="pin" type="password" inputmode="numeric" maxlength="4" required placeholder="••••"></label>
    <div class="row"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn primary">Entrar</button></div>
  </form>`);
}
function delMemberModal(m) {
  openModal(`<h3>¿Eliminar a ${esc(m.name)}?</h3>
  <p>Se borrarán también todos sus regalos. No se puede deshacer.</p>
  <form data-form="delMember" data-id="${esc(m.id)}">
    ${m.pinHash ? `<label>PIN de ${esc(m.name)}<input class="pin" name="pin" type="password" inputmode="numeric" maxlength="4" required placeholder="••••"></label>` : ""}
    <div class="row"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn primary">Sí, eliminar</button></div>
  </form>`);
}

/* ---------- Acciones ---------- */
function doLogin(id) { S.me = id; S.tab = "mine"; S.viewing = null; store("reyes_me", id); closeModal(); render(); }
const meObj = () => S.members.find(m => m.id === S.me);

const ACT = {
  closeModal,
  overlay: (_, el, e) => { if (e.target === el) closeModal(); },
  toggleManage: () => { S.manage = !S.manage; render(); },
  addMember: memberModal,
  login: id => {
    if (S.manage) return;
    const m = S.members.find(x => x.id === id); if (!m) return;
    m.pinHash ? pinModal(m) : doLogin(id);
  },
  delMember: id => { const m = S.members.find(x => x.id === id); if (m) delMemberModal(m); },
  logout: () => { S.me = null; S.viewing = null; S.manage = false; store("reyes_me", null); render(); },
  tab: (_, el) => { S.tab = el.dataset.tab; S.viewing = null; render(); window.scrollTo(0, 0); },
  open: id => { S.viewing = id; render(); window.scrollTo(0, 0); },
  back: () => { S.viewing = null; render(); },
  nudge: async id => {
    const me = meObj(); if (!me || id === me.id) return;
    if (giftsOf(id).length > 0) return toast("Esa persona ya ha apuntado regalos 🎉");
    try {
      await runTransaction(db, async tx => {
        const ref = doc(db, "members", id), s = await tx.get(ref);
        if (!s.exists()) throw new Error("gone");
        if (Date.now() - (s.data().lastNudge || 0) < DAY) throw new Error("recent");
        tx.update(ref, { lastNudge: Date.now() });
      });
      toast("¡Toque enviado! 👋 Nadie sabrá que has sido tú");
    } catch (e) {
      toast(e.message === "recent" ? "Hoy ya le han dado un toque 😉" : "No se pudo enviar. Inténtalo de nuevo.");
    }
  },
  addGift: () => giftModal(null),
  editGift: id => giftModal(id),
  delGift: async id => {
    const g = S.gifts.find(x => x.id === id);
    if (!g || !confirm(`¿Borrar "${g.title}" de tu lista?`)) return;
    try { const b = writeBatch(db); b.delete(doc(db, "gifts", id)); await b.commit(); toast("Regalo borrado"); }
    catch { toast("No se pudo borrar. Inténtalo de nuevo."); }
  },
  buy: async id => {
    const me = meObj(); if (!me) return;
    try {
      await runTransaction(db, async tx => {
        const ref = doc(db, "gifts", id), s = await tx.get(ref);
        if (!s.exists()) throw new Error("gone");
        const d = s.data();
        if (d.ownerId === me.id) throw new Error("own");
        if (d.boughtBy) throw new Error("taken");
        tx.update(ref, { boughtBy: me.id, boughtByName: me.name });
      });
      toast("¡Marcado como comprado! 🎉");
    } catch (e) {
      toast(e.message === "taken" ? "Vaya, alguien lo acaba de marcar antes 😅" : "No se pudo guardar. Inténtalo de nuevo.");
    }
  },
  unbuy: async id => {
    const g = S.gifts.find(x => x.id === id);
    if (!g || g.boughtBy !== S.me) return;
    try { await updateDoc(doc(db, "gifts", id), { boughtBy: null, boughtByName: null }); toast("Desmarcado"); }
    catch { toast("No se pudo guardar. Inténtalo de nuevo."); }
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.id, el, e);
});

const FORMS = {
  async gift(f) {
    const fd = new FormData(f), id = f.dataset.id;
    const title = fd.get("title").trim();
    if (!title) return;
    const price = fd.get("price");
    const data = {
      title, url: safeUrl(fd.get("url")),
      price: price !== "" && !isNaN(parseFloat(price)) ? parseFloat(price) : null,
      note: fd.get("note").trim(), priority: parseInt(fd.get("priority"), 10) || 2
    };
    try {
      if (id) await updateDoc(doc(db, "gifts", id), data);
      else {
        await addDoc(collection(db, "gifts"), { ...data, ownerId: S.me, boughtBy: null, boughtByName: null, createdAt: serverTimestamp() });
        if (meObj()?.lastNudge) await updateDoc(doc(db, "members", S.me), { lastNudge: null });
      }
      closeModal(); toast(id ? "Regalo actualizado ✨" : "¡Regalo añadido! 🎁");
    } catch { toast("No se pudo guardar. Inténtalo de nuevo."); }
  },
  async member(f) {
    const fd = new FormData(f), name = fd.get("name").trim(), pin = (fd.get("pin") || "").trim();
    if (!name) return;
    if (pin && !/^\d{4}$/.test(pin)) return toast("El PIN son 4 números");
    if (S.members.some(m => m.name.toLowerCase() === name.toLowerCase())) return toast("Ya hay alguien con ese nombre");
    try {
      const ref = await addDoc(collection(db, "members"), { name, pinHash: pin ? await hashPin(pin) : null, createdAt: serverTimestamp() });
      closeModal(); toast(`¡Bienvenido/a, ${name}! 👑`);
      if (!S.manage) { S.me = ref.id; store("reyes_me", ref.id); S.tab = "mine"; render(); }
    } catch { toast("No se pudo añadir. Inténtalo de nuevo."); }
  },
  async pin(f) {
    const m = S.members.find(x => x.id === f.dataset.id); if (!m) return;
    const pin = new FormData(f).get("pin").trim();
    if ((await hashPin(pin)) === m.pinHash) doLogin(m.id);
    else { toast("PIN incorrecto 🙈"); f.reset(); }
  },
  async delMember(f) {
    const m = S.members.find(x => x.id === f.dataset.id); if (!m) return;
    if (m.pinHash) {
      const pin = (new FormData(f).get("pin") || "").trim();
      if ((await hashPin(pin)) !== m.pinHash) { toast("PIN incorrecto 🙈"); return; }
    }
    try {
      const b = writeBatch(db);
      S.gifts.forEach(g => {
        if (g.ownerId === m.id) b.delete(doc(db, "gifts", g.id));
        else if (g.boughtBy === m.id) b.update(doc(db, "gifts", g.id), { boughtBy: null, boughtByName: null });
      });
      b.delete(doc(db, "members", m.id));
      await b.commit();
      if (S.me === m.id) { S.me = null; store("reyes_me", null); }
      closeModal(); toast("Persona eliminada");
    } catch { toast("No se pudo eliminar. Inténtalo de nuevo."); }
  }
};
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form]?.(f);
});

/* ---------- Arranque ---------- */
render();
if (configured) start();
</script>
</body>
